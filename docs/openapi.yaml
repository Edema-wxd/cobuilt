openapi: 3.1.0

info:
  title: CoBuilt Investment Partners API
  version: 0.1.0
  description: |
    Backend API for the CoBuilt corporate website (Var-2026-003, Phase 1).

    ## Authentication
    Identity is Neon Auth (Managed Better Auth): sign-up, sign-in, email
    verification and password reset are served by the Neon Auth endpoint, not by
    this API. Its access token — an EdDSA JWT valid for 15 minutes — is sent as
    `Authorization: Bearer <token>`. The API verifies it against the branch
    JWKS and resolves it to the account in `users`, which supplies the role and
    permissions; a verified Neon Auth user with no matching account is refused
    with 403.

    ## Errors
    Every error shares one shape:
    ```json
    { "error": { "code": "not_found", "message": "Project not found",
                 "details": null, "requestId": "..." } }
    ```
    Quote the `requestId` when reporting a problem; it appears in the logs.

    ## Rate limits
    Limited endpoints return `RateLimit-Limit`, `RateLimit-Remaining` and
    `RateLimit-Reset`, and `Retry-After` on a 429.
  contact:
    name: Varyn Ltd
  license:
    name: Proprietary — confidential

servers:
  - url: https://api.cobuilt.com
    description: Production
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Projects
  - name: Project Passport
  - name: Virtual Tours
  - name: News
  - name: Services
  - name: Videos
  - name: FAQs
  - name: Leadership
  - name: Search
  - name: Forms
  - name: Authentication
  - name: Admin
  - name: Data protection
  - name: Integrations
  - name: System

paths:
  /api/health:
    get:
      tags: [System]
      summary: Service health and dependency status
      description: |
        200 `healthy` — all dependencies reachable.
        200 `degraded` — PostgreSQL is up, something optional is not; keep serving.
        503 `unhealthy` — PostgreSQL is unreachable; remove the node from the pool.
      security: []
      responses:
        '200':
          description: Healthy or degraded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Unhealthy — PostgreSQL unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /api/cron/nightly:
    get:
      tags: [System]
      summary: Nightly maintenance (Vercel Cron)
      description: |
        Invoked by Vercel Cron at 02:00 UTC with `Authorization: Bearer
        $CRON_SECRET`. Retries queued jobs whose backoff has elapsed, runs the
        NDPA retention purge and rebuilds the search index.
      security: []
      responses:
        '200': { description: Maintenance ran; per-queue counts in the body }
        '401': { description: Missing or wrong cron secret }
        '503': { description: CRON_SECRET is not configured }

  /api/projects:
    get:
      tags: [Projects]
      summary: List projects
      security: []
      parameters:
        - { name: status,   in: query, schema: { $ref: '#/components/schemas/ProjectStatus' } }
        - { name: type,     in: query, schema: { type: string }, description: Project-type slug or UUID }
        - { name: location, in: query, schema: { type: string }, description: Location slug or UUID }
        - { name: sector,   in: query, schema: { type: string }, description: Sector slug or UUID }
        - { name: tag,      in: query, schema: { type: string }, description: Tag slug }
        - { name: q,        in: query, schema: { type: string, maxLength: 200 }, description: Full-text search }
        - { name: sort,     in: query, schema: { type: string, enum: [recent, title, oldest], default: recent } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: includeUnpublished
          in: query
          description: Include drafts. Ignored unless the caller is an admin or editor.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: A page of projects
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      results:
                        type: array
                        items: { $ref: '#/components/schemas/Project' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Projects]
      summary: Create a project
      description: Requires role `admin` or `editor` and permission `projects:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectAdmin' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/projects/{idOrSlug}:
    parameters:
      - $ref: '#/components/parameters/IdOrSlug'
    get:
      tags: [Projects]
      summary: Project detail
      description: |
        Investor figures are present only when CoBuilt's legal team has approved
        that project's investor content; otherwise `investor` is `null`.
      security: []
      responses:
        '200':
          description: The project, with a Passport progress summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Projects]
      summary: Update a project
      description: |
        Requires `admin` or `editor` with `projects:write`. Changing
        `investorHighlights` revokes any existing legal approval.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectAdmin' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Projects]
      summary: Soft-delete a project
      description: Requires `admin` with `projects:delete`. The row is retained for audit.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/projects/{idOrSlug}/passport:
    parameters:
      - $ref: '#/components/parameters/IdOrSlug'
    get:
      tags: [Project Passport]
      summary: Project Passport™ timeline
      security: []
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/MilestoneStatus' } }
        - name: includeInternal
          in: query
          description: Include non-public milestones. Ignored unless the caller is staff.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Milestones with a progress summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PassportTimeline' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Project Passport]
      summary: Record a milestone
      description: Requires `admin` or `editor` with `passport:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MilestoneInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Milestone' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/projects/{idOrSlug}/passport/{milestoneId}:
    parameters:
      - $ref: '#/components/parameters/IdOrSlug'
      - { name: milestoneId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Project Passport]
      summary: Milestone detail
      security: []
      responses:
        '200':
          description: The milestone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Milestone' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Project Passport]
      summary: Update a milestone
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Milestone' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Project Passport]
      summary: Delete a milestone
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/projects/{idOrSlug}/tours:
    parameters:
      - $ref: '#/components/parameters/IdOrSlug'
    get:
      tags: [Virtual Tours]
      summary: 3D tours for a project
      description: Public callers see only tours whose asset has finished processing.
      security: []
      responses:
        '200':
          description: Tours
          content:
            application/json:
              schema:
                type: object
                properties:
                  projectId: { type: string, format: uuid }
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/Tour' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/faqs:
    get:
      tags: [FAQs]
      summary: List published FAQs
      security: []
      parameters:
        - { name: category, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: Every published FAQ, in editorial order
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        question: { type: string }
                        answer: { type: string }
                        category: { type: string, nullable: true }

  /api/leadership:
    get:
      tags: [Leadership]
      summary: List published leadership profiles
      description: |
        Every published leader, in editorial order; drafts are never returned.
        `featured=true` narrows the list to the homepage spotlight. Cached for
        a minute (`s-maxage=60`); console writes clear the application cache
        at once.
      security: []
      parameters:
        - { name: featured, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Published leaders
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/Leader' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/news:
    get:
      tags: [News]
      summary: List news articles
      security: []
      parameters:
        - name: category
          in: query
          description: |
            One of `NewsCategory`, or a CMS category of its own. The launch-era
            names `update` and `announcement` select project updates and company
            announcements, and spelling is forgiven (`Press release`).
          schema: { type: string, maxLength: 100 }
        - { name: tag,      in: query, schema: { type: string } }
        - { name: q,        in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of articles, newest first, without article bodies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      results:
                        type: array
                        items: { $ref: '#/components/schemas/NewsSummary' }
    post:
      tags: [News]
      summary: Create an article
      description: Requires `admin` or `editor` with `news:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewsInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/News' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/news/{idOrSlug}:
    parameters:
      - $ref: '#/components/parameters/IdOrSlug'
    get:
      tags: [News]
      summary: Article detail with related articles
      security: []
      responses:
        '200':
          description: The article
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [News]
      summary: Update an article
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/News' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [News]
      summary: Soft-delete an article
      description: Requires `admin` with `news:delete`.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/news/by-category/{category}:
    get:
      tags: [News]
      summary: Articles in a category
      description: |
        `category` is read as `/api/news?category=` reads it: `update` and
        `announcement` answer as `project_update` and `company_announcement`,
        and the response's `category` is the normalised value.
      security: []
      parameters:
        - { name: category, in: path, required: true, schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of articles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      category: { type: string }
                      results:
                        type: array
                        items: { $ref: '#/components/schemas/NewsSummary' }

  /api/services:
    get:
      tags: [Services]
      summary: List published services
      description: |
        Every published service, in the order set in the console. Unpaginated:
        the set is a handful of disciplines. Drafts never appear here, whoever
        is asking.
      security: []
      responses:
        '200':
          description: Published services in display order
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/ServiceSummary' }

  /api/services/{slug}:
    get:
      tags: [Services]
      summary: Service detail with its projects
      description: |
        A published service with the live projects attached to it in the
        console, split into case studies and other related projects, each in
        the order the editor set. Draft, scheduled and deleted projects are
        left out. An unpublished service is a 404.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The service
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/videos:
    get:
      tags: [Videos]
      summary: List published videos
      description: |
        Published videos from the library, in the order set in the console, a
        page at a time. `category` narrows to one category, `project` to one
        live project's films (by its slug), and `q` matches words in the title,
        the description or the linked project's name (`%` and `_` match
        themselves). Drafts never appear here, whoever is asking. A video links
        its project only while that project is published.
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 24 } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/VideoCategory' } }
        - { name: project, in: query, description: A project's slug, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        '200':
          description: Published videos in display order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      results:
                        type: array
                        items: { $ref: '#/components/schemas/Video' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/videos/{slug}:
    get:
      tags: [Videos]
      summary: Video detail with related videos
      description: |
        A published video and up to three related published videos: the same
        live project's first, then the same category's. An unpublished video
        is a 404.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The video
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VideoDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/search:
    get:
      tags: [Search]
      summary: Site-wide search
      description: |
        Searches projects, news and FAQs. `engine` reports which backend
        answered: `meilisearch`, or `postgres` when the fallback is in use.
      security: []
      parameters:
        - { name: q,        in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: type,     in: query, schema: { type: string, enum: [project, news, faq] } }
        - { name: status,   in: query, schema: { type: string } }
        - { name: sector,   in: query, schema: { type: string } }
        - { name: location, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Ranked results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/search/autocomplete:
    get:
      tags: [Search]
      summary: Search-box suggestions
      security: []
      parameters:
        - { name: q,     in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 8 } }
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  query: { type: string }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:    { type: string }
                        type:  { type: string, enum: [project, news, faq] }
                        title: { type: string }
                        url:   { type: string }

  /api/search/facets:
    get:
      tags: [Search]
      summary: Available filters with counts
      description: Counts cover live content only, so a filter never returns nothing.
      security: []
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [project, news], default: project } }
      responses:
        '200':
          description: Facets
          content:
            application/json:
              schema: { type: object }

  /api/forms/inquiry:
    post:
      tags: [Forms]
      summary: Submit a contact enquiry
      description: |
        Rate limited to 5 per hour per IP. Submissions scored as spam receive an
        identical response to clean ones, and are stored for review without
        notifying anyone.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InquiryInput' }
      responses:
        '201':
          description: Received
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:      { type: boolean }
                  submissionId: { type: string, format: uuid }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/forms/investment:
    post:
      tags: [Forms]
      summary: Submit an investor enquiry
      description: |
        Phase 1 is informational only. This records an expression of interest and
        routes it to legal for review. It creates no account, makes no offer, and
        is not a solicitation to buy securities. Rate limited to 10 per hour per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvestmentInput' }
      responses:
        '201':
          description: Received and held for legal review
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:      { type: boolean }
                  submissionId: { type: string, format: uuid }
                  message:      { type: string }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/forms/newsletter:
    post:
      tags: [Forms]
      summary: Subscribe to the newsletter
      description: |
        Double opt-in: a confirmation email is sent and the address is not mailed
        until confirmed. The response is identical for a new and an existing
        address, so the endpoint cannot be used to test list membership.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:    { type: string, format: email }
                fullName: { type: string }
                source:   { type: string }
                website:  { $ref: '#/components/schemas/Honeypot' }
      responses:
        '200':
          description: Confirmation email queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/forms/newsletter/confirm:
    get:
      tags: [Forms]
      summary: Confirm a subscription
      description: Reached from the confirmation email. The token is single-use.
      security: []
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Subscription confirmed }
        '400': { description: Invalid or already-used link }

  /api/forms/newsletter/unsubscribe:
    get:
      tags: [Forms]
      summary: Unsubscribe (one-click from an email footer)
      security: []
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Unsubscribed }
    post:
      tags: [Forms]
      summary: Unsubscribe (preference page)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200': { description: Unsubscribed }

  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Current user and effective permissions
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:        { $ref: '#/components/schemas/User' }
                  permissions: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Invite someone by email
      description: |
        Admin only. Creates the application account (role and permissions) with
        no credentials. The person then signs up in Neon Auth with the same
        address; once Neon Auth has verified it, the two are linked on their
        first authenticated request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, fullName]
              properties:
                email:    { type: string, format: email }
                fullName: { type: string }
                role:     { $ref: '#/components/schemas/Role' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/analytics:
    get:
      tags: [Admin]
      summary: Dashboard metrics
      description: Requires `admin` or `viewer` with `analytics:read`.
      parameters:
        - { name: period, in: query, schema: { type: string, enum: ['7', '30', '90'], default: '30' } }
      responses:
        '200':
          description: Traffic, submissions and content counts
          content:
            application/json:
              schema: { type: object }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/taxonomy:
    get:
      tags: [Admin]
      summary: Taxonomy options for the project editor
      description: |
        Every project type, location, sector, service and tag with its id.
        Requires `admin` or `editor` with `projects:write`. Unlike
        `/api/search/facets`, this lists values no live project uses yet.
      responses:
        '200':
          description: Taxonomy lists, each sorted by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  projectTypes: { type: array, items: { $ref: '#/components/schemas/TaxonomyLabel' } }
                  locations:    { type: array, items: { $ref: '#/components/schemas/TaxonomyLabel' } }
                  sectors:      { type: array, items: { $ref: '#/components/schemas/TaxonomyLabel' } }
                  services:     { type: array, items: { $ref: '#/components/schemas/TaxonomyLabel' } }
                  tags:         { type: array, items: { $ref: '#/components/schemas/TaxonomyLabel' } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/audit-log:
    get:
      tags: [Admin]
      summary: System audit trail
      description: Requires `admin` with `audit:read`.
      parameters:
        - { name: action,     in: query, schema: { type: string } }
        - { name: entityType, in: query, schema: { type: string } }
        - { name: actorId,    in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Audit entries, newest first
          content:
            application/json:
              schema: { type: object }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/users:
    get:
      tags: [Admin]
      summary: List accounts
      parameters:
        - { name: role,     in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: isActive, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of accounts
          content:
            application/json:
              schema: { type: object }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/users/{userId}/role:
    post:
      tags: [Admin]
      summary: Change a role or its permission overrides
      description: |
        Revokes the user's sessions so the change takes effect within one
        access-token lifetime. An admin cannot remove their own admin role.
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
                permissions:
                  type: object
                  description: Per-user overrides. Revocation always wins.
                  properties:
                    grant:  { type: array, items: { type: string } }
                    revoke: { type: array, items: { type: string } }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { description: Cannot remove your own admin role }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/forms:
    get:
      tags: [Admin]
      summary: List form submissions
      description: Contact details are masked here; the detail endpoint reveals them.
      parameters:
        - { name: formType,      in: query, schema: { type: string, enum: [inquiry, newsletter, investment] } }
        - { name: flaggedAsSpam, in: query, schema: { type: boolean } }
        - { name: processed,     in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of submissions
          content:
            application/json:
              schema: { type: object }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/forms/{submissionId}:
    get:
      tags: [Admin]
      summary: Full submission, contact details included
      description: Each read is written to the audit log.
      parameters:
        - { name: submissionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The submission
          content:
            application/json:
              schema: { type: object }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/forms/{submissionId}/flag-spam:
    post:
      tags: [Admin]
      summary: Mark or unmark a submission as spam
      parameters:
        - { name: submissionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                flagged: { type: boolean, default: true }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/projects/{projectId}/investor-approval:
    post:
      tags: [Admin]
      summary: Approve or revoke investor content
      description: |
        The legal sign-off gate. Until approval is granted, the public project
        endpoint omits investment amount, expected ROI and highlights entirely.
        Editing that content revokes the approval automatically.
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved: { type: boolean }
                note:     { type: string, description: Legal reference, recorded in the audit log }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectAdmin' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/settings/homepage:
    get:
      tags: [Admin]
      summary: Homepage settings, with the figures the page computes
      description: |
        Requires `admin` with `settings:write`. A homepage that was never
        saved returns the defaults: every text field null (the page as
        built), no video, no figure overrides, every optional section on.
        `computed` is what the stat band counts from live projects, so a form
        can show what an override replaces; units have no column and are never
        computed.
      responses:
        '200':
          description: Settings and computed figures
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomepageSettingsView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Admin]
      summary: Replace the homepage settings
      description: |
        Requires `admin` with `settings:write`. The whole document is sent
        and replaces what is stored; a null (or empty) text field restores the
        copy as built. The video link must be a YouTube link to one video
        (watch, youtu.be, Shorts, live or embed) and is stored as the canonical
        watch URL; anything else is a 422 on `video.url`. Audited as
        `settings.updated` with the fields that changed. The landing page
        regenerates within a minute; the save also requests regeneration at
        once, and `revalidated` says whether that succeeded.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HomepageSettings' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/HomepageSettingsView'
                  - type: object
                    properties:
                      revalidated: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/uploadthing:
    get:
      tags: [Virtual Tours]
      summary: UploadThing upload endpoint
      description: |
        Used by the UploadThing client, not called directly. `POST` requests an
        upload URL for the `tourModel` route and is authorised by the console's
        bearer token and the `tours:write` permission; UploadThing also calls it
        back when an upload completes. The request and response shapes are
        UploadThing's own.
      responses:
        '200': { description: Route configuration }
    post:
      tags: [Virtual Tours]
      summary: Request an upload, or receive UploadThing's completion callback
      responses:
        '200': { description: Upload URLs issued }
        '400': { description: Rejected — wrong file type, over the size limit, or not authorised }

  /api/admin/tours:
    post:
      tags: [Virtual Tours]
      summary: Register an uploaded tour
      description: |
        The model is uploaded first, from the browser straight to UploadThing
        (`/api/uploadthing`, authorised by the same bearer token). A
        `threejs_model` tour is accepted only once that file is confirmed
        present in storage, so an upload that never finished cannot leave a
        tour record pointing at nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TourInput' }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tour' }
        '400': { description: No uploaded file found for that key }
        '503': { description: Object storage is not configured }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/admin/tours/{tourId}:
    patch:
      tags: [Virtual Tours]
      summary: Update a tour
      description: |
        Every field is optional and `null` clears one. The format cannot be
        changed. A `threejs_model` tour takes a new `modelKey` (from a fresh
        upload) to replace its file — the old file is deleted — and rejects
        `tourUrl` and `embedCode`; the other formats reject `modelKey`. Clearing
        the last payload a format needs is a 422.
      parameters:
        - { name: tourId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TourUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tour' }
        '400': { description: No uploaded file found for that key }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Virtual Tours]
      summary: Delete a tour and its stored asset
      parameters:
        - { name: tourId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/leadership:
    get:
      tags: [Leadership]
      summary: List every leader, drafts included
      description: Requires `admin` or `editor` with `leadership:write`. In running order.
      responses:
        '200':
          description: Every leader
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/LeaderAdmin' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Leadership]
      summary: Create a leadership profile
      description: |
        Requires `admin` or `editor` with `leadership:write`. A new profile is
        a draft unless `published` is true, and goes to the end of the running
        order. The slug is derived from the name when omitted. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaderInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaderAdmin' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/admin/leadership/{leaderId}:
    parameters:
      - { name: leaderId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Leadership]
      summary: One leader, draft or published
      responses:
        '200':
          description: The leader
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaderAdmin' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Leadership]
      summary: Update a leadership profile
      description: |
        Requires `admin` or `editor` with `leadership:write`. Only the fields
        sent change; `null` clears an optional one. Audited with the field
        names, and the new publication and spotlight state when they change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaderUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaderAdmin' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Leadership]
      summary: Delete a leadership profile
      description: Requires `admin` with `leadership:write`. Audited.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/leadership/reorder:
    post:
      tags: [Leadership]
      summary: Set the running order
      description: |
        Requires `admin` or `editor` with `leadership:write`. Takes every
        leader's id, each once, in the new order. A list that no longer
        matches the table — a leader added or removed since it was loaded — is
        a 409 and nothing is changed. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Every leader, in the new order
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/LeaderAdmin' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/admin/services:
    get:
      tags: [Services]
      summary: List every service, drafts included
      description: Requires `admin` or `editor` with `services:write`.
      responses:
        '200':
          description: Every service in display order
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/ServiceAdmin' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Services]
      summary: Create a service
      description: |
        Requires `admin` or `editor` with `services:write`. The service is added
        at the end of the list, and is a draft unless `published` is true. A
        missing slug is made from the title, and suffixed (`-2`) if taken.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAdmin' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Another service has that title }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/admin/services/reorder:
    post:
      tags: [Services]
      summary: Set the display order
      description: |
        Requires `admin` or `editor` with `services:write`. `ids` is every
        service, once each, in the new order; a list that leaves one out or
        names one that does not exist is a 422, because the screen it came from
        is out of date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              additionalProperties: false
              properties:
                ids: { type: array, items: { type: string, format: uuid } }
      responses:
        '200':
          description: Every service in its new order
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/ServiceAdmin' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/admin/services/{serviceId}:
    parameters:
      - { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Services]
      summary: A service with every attached project
      description: Requires `admin` or `editor` with `services:write`. Draft projects are included and flagged.
      responses:
        '200':
          description: The service
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAdminDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Services]
      summary: Update, publish or unpublish a service
      description: |
        Requires `admin` or `editor` with `services:write`. Every field is
        optional; the ones present are applied. `published: false` takes the
        page off the public site and keeps everything for later.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAdminDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Another service has that title or slug }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Services]
      summary: Delete a service
      description: |
        Requires `admin` with `services:write`. Also removes the service from
        every project tagged with it. Cannot be undone; unpublishing is the
        reversible alternative.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/services/{serviceId}/projects:
    parameters:
      - { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Services]
      summary: Set the projects shown on a service page
      description: |
        Requires `admin` or `editor` with `services:write`. Replaces the list;
        the array order is the page order. Draft projects may be attached and
        appear on the page once published. An unknown or deleted project is a
        422 naming its position, and nothing is changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projects]
              additionalProperties: false
              properties:
                projects:
                  type: array
                  maxItems: 24
                  items:
                    type: object
                    required: [projectId]
                    properties:
                      projectId: { type: string, format: uuid }
                      caseStudy: { type: boolean, default: false }
      responses:
        '200':
          description: The projects now on the page
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/ServiceProjectAdmin' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/admin/videos:
    get:
      tags: [Videos]
      summary: List every video, drafts included
      description: Requires `admin` or `editor` with `videos:write`.
      responses:
        '200':
          description: Every video in display order
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/VideoAdmin' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Videos]
      summary: Add a video
      description: |
        Requires `admin` or `editor` with `videos:write`. The video is added at
        the end of the list, and is a draft unless `published` is true. A
        missing slug is made from the title, and suffixed (`-2`) if taken. A
        link that is not one YouTube video is a 422 on `youtubeUrl`; an
        unknown or deleted project is a 422 on `projectId`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VideoInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VideoAdmin' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: That YouTube video is already in the library }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/admin/videos/reorder:
    post:
      tags: [Videos]
      summary: Set the display order
      description: |
        Requires `admin` or `editor` with `videos:write`. `ids` is every video,
        once each, in the new order; a list that leaves one out or names one
        that does not exist is a 422, because the screen it came from is out
        of date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              additionalProperties: false
              properties:
                ids: { type: array, items: { type: string, format: uuid } }
      responses:
        '200':
          description: Every video in its new order
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/VideoAdmin' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/admin/videos/{videoId}:
    parameters:
      - { name: videoId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Videos]
      summary: A video, whatever its state
      description: Requires `admin` or `editor` with `videos:write`.
      responses:
        '200':
          description: The video
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VideoAdmin' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Videos]
      summary: Update, publish, feature or unpublish a video
      description: |
        Requires `admin` or `editor` with `videos:write`. Every field is
        optional; the ones present are applied. `published: false` takes the
        video off the public site and keeps it for later; `projectId: null`
        unlinks its project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VideoUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VideoAdmin' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Another video has that YouTube link or slug }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Videos]
      summary: Delete a video
      description: |
        Requires `admin` with `videos:write`. Removes the library entry; the
        film itself stays on YouTube. Cannot be undone; unpublishing is the
        reversible alternative.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/users/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Data protection]
      summary: Profile (self or admin)
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Data protection]
      summary: Erasure request (NDPA)
      description: |
        Deactivates the account, releases the email address, anonymises every
        form submission from it and removes the newsletter record. Audited.
      responses:
        '200':
          description: Erased
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:                { type: boolean }
                  message:                { type: string }
                  submissionsAnonymised:  { type: integer }
                  newsletterRemoved:      { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/users/{userId}/export:
    get:
      tags: [Data protection]
      summary: Subject access request (NDPA)
      description: |
        Returns everything held about the subject — profile, form submissions,
        page views, sessions and newsletter record — as a JSON attachment. Self
        or admin; audited.
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: A JSON attachment
          content:
            application/json:
              schema: { type: object }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/data-subjects/export:
    post:
      tags: [Data protection]
      summary: Subject access request for someone without an account (NDPA)
      description: |
        Returns form submissions, the newsletter record, chat events and
        WhatsApp messages held for an email address and/or phone number, as a
        JSON attachment. POST so the identifiers stay out of URLs and access
        logs. Phone numbers match on digits, in both local (0801...) and
        international (234801...) form. If a staff account uses the email, its
        id is returned; export it with `/api/users/{userId}/export`. Requires
        `privacy:manage`; audited with masked identifiers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataSubject' }
      responses:
        '200':
          description: A JSON attachment
          content:
            application/json:
              schema: { type: object }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/admin/data-subjects/erase:
    post:
      tags: [Data protection]
      summary: Erasure request for someone without an account (NDPA)
      description: |
        In one transaction, anonymises matching form submissions and deletes
        the newsletter record, chat events and WhatsApp messages. A staff
        account under the same email is not touched; its id is returned so it
        can be closed with `DELETE /api/users/{userId}`. Requires
        `privacy:manage`; audited with masked identifiers and counts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataSubject' }
      responses:
        '200':
          description: What was erased
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:                 { type: boolean }
                  submissionsAnonymised:   { type: integer }
                  newsletterRemoved:       { type: integer }
                  chatEventsDeleted:       { type: integer }
                  whatsappMessagesDeleted: { type: integer }
                  accountId:               { type: [string, 'null'], format: uuid }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/csp-report:
    post:
      tags: [System]
      summary: Content Security Policy violation reports
      description: |
        Receives the reports browsers send under the page Content Security
        Policy, in the legacy `report-uri` shape or the Reporting API's. Each
        violation is logged with its directive, the blocked origin and the page
        path only. Rate limited per client; always answers 204.
      security: []
      requestBody:
        required: true
        content:
          application/csp-report:
            schema: { type: object }
          application/reports+json:
            schema: { type: array, items: { type: object } }
      responses:
        '204': { description: Received }

  /api/analytics/pageview:
    post:
      tags: [System]
      summary: First-party page-view beacon
      description: |
        The client IP is truncated (`/24`, or `/48` for IPv6) before storage, so
        this records traffic shape without building a per-visitor profile.
        Always answers 204, including on failure.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:      { type: string }
                referrer:  { type: string }
                sessionId: { type: string, description: Opaque per-visit id, not linked to a person }
      responses:
        '204': { description: Recorded }

  /api/integrations/cms-webhooks:
    post:
      tags: [Integrations]
      summary: CMS publish webhook
      description: |
        Authenticated by HMAC over the raw body (`X-CMS-Signature`) or a bearer
        token. See `docs/cms-sync.md`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, model]
              properties:
                event: { type: string, enum: [entry.create, entry.update, entry.publish, entry.unpublish, entry.delete] }
                model: { type: string, enum: [project, news-article, faq, leadership] }
                entry: { type: object }
      responses:
        '200': { description: Applied or skipped }
        '401': { description: Invalid signature }
        '500': { description: Sync failed — the CMS should retry }

  /api/integrations/whatsapp:
    get:
      tags: [Integrations]
      summary: Meta webhook subscription handshake
      security: []
      parameters:
        - { name: 'hub.mode',         in: query, schema: { type: string } }
        - { name: 'hub.verify_token', in: query, schema: { type: string } }
        - { name: 'hub.challenge',    in: query, schema: { type: string } }
      responses:
        '200': { description: Echoes the challenge }
        '403': { description: Verify token mismatch }
    post:
      tags: [Integrations]
      summary: Receive WhatsApp messages and statuses
      description: |
        Verified by the app-secret HMAC (`X-Hub-Signature-256`). Acknowledged
        immediately, then processed, because Meta retries anything not
        acknowledged quickly. Deliveries are idempotent on the provider message id.
      security: []
      responses:
        '200': { description: Received }
        '401': { description: Invalid signature }

  /api/integrations/chat:
    post:
      tags: [Integrations]
      summary: Live-chat provider webhook
      description: Verified by HMAC over the raw body.
      security: []
      responses:
        '200': { description: Received }
        '401': { description: Invalid signature }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 15-minute Neon Auth access token (`authClient.token()`).

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
    IdOrSlug:
      name: idOrSlug
      in: path
      required: true
      description: The record's slug or its UUID.
      schema: { type: string }

  responses:
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated, but the role or permission is insufficient
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such record
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflicts with an existing record, usually a duplicate slug
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: The request failed validation; `details` names each field
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds until the window resets
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:      { type: string }
            message:   { type: string }
            details:   {}
            requestId: { type: string }

    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                details:
                  type: array
                  items:
                    type: object
                    properties:
                      field:   { type: string }
                      message: { type: string }

    Paginated:
      type: object
      properties:
        results: { type: array, items: {} }
        pagination:
          type: object
          properties:
            page:        { type: integer }
            pageSize:    { type: integer }
            total:       { type: integer }
            totalPages:  { type: integer }
            hasNextPage: { type: boolean }

    Health:
      type: object
      properties:
        status: { type: string, enum: [healthy, degraded, unhealthy] }
        checks:
          type: object
          properties:
            database: { type: boolean }
            redis:    { type: boolean }
            search:   { description: Boolean, or "not_configured" }
            cms:      { description: Boolean, or "not_configured" }
        degraded:  { type: array, items: { type: string } }
        version:   { type: string }
        timestamp: { type: string, format: date-time }

    Role:
      type: string
      enum: [admin, editor, viewer, investor]

    DataSubject:
      type: object
      description: At least one of `email` and `phone` is required.
      properties:
        email: { type: string, format: email }
        phone: { type: string, example: '0801 234 5678' }

    ProjectStatus:
      type: string
      enum: [future, ongoing, completed]

    MilestoneType:
      type: string
      enum: [commencement, foundation, superstructure, roofing, mep, finishes, practical_completion, handover, custom]

    MilestoneStatus:
      type: string
      enum: [pending, in_progress, completed, delayed]

    Honeypot:
      type: string
      maxLength: 0
      description: Hidden field. A non-empty value marks the submission as a bot.

    Project:
      type: object
      properties:
        id:               { type: string, format: uuid }
        title:            { type: string }
        slug:             { type: string }
        description:      { type: string, nullable: true }
        longDescription:  { type: string, nullable: true }
        status:           { $ref: '#/components/schemas/ProjectStatus' }
        projectType:      { type: string, nullable: true }
        location:         { type: string, nullable: true }
        sector:           { type: string, nullable: true }
        featuredImageUrl: { type: string, nullable: true }
        brochureUrl:      { type: string, nullable: true }
        timelineVideoUrls: { type: array, items: { type: string } }
        galleryIds:       { type: array, items: { type: string, format: uuid } }
        serviceIds:       { type: array, items: { type: string, format: uuid } }
        tagIds:           { type: array, items: { type: string, format: uuid } }
        passport:
          type: object
          properties:
            enabled:          { type: boolean }
            startDate:        { type: string, format: date, nullable: true }
            completionTarget: { type: string, format: date, nullable: true }
        investor:
          nullable: true
          description: Null until legal approves this project's investor content.
          type: object
          properties:
            investmentAmount: { type: number, nullable: true }
            expectedRoi:      { type: number, nullable: true }
            highlights:       { nullable: true }
        seo:
          type: object
          properties:
            metaTitle:         { type: string, nullable: true }
            metaDescription:   { type: string, nullable: true }
            openGraphImageUrl: { type: string, nullable: true }
            canonicalUrl:      { type: string, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
        updatedAt:   { type: string, format: date-time, nullable: true }

    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          properties:
            passportProgress:
              nullable: true
              type: object
              properties:
                total:           { type: integer }
                completed:       { type: integer }
                percentComplete: { type: integer }
                nextMilestone:
                  nullable: true
                  type: object
                  properties:
                    title:         { type: string, nullable: true }
                    type:          { $ref: '#/components/schemas/MilestoneType' }
                    scheduledDate: { type: string, format: date, nullable: true }

    ProjectAdmin:
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          description: Admin view — investor figures are always present, with their approval state.
          properties:
            investor:
              type: object
              properties:
                investmentAmount: { type: number, nullable: true }
                expectedRoi:      { type: number, nullable: true }
                highlights:       { nullable: true }
                approved:         { type: boolean }
            isPublished: { type: boolean }
            createdAt:   { type: string, format: date-time }
            deletedAt:   { type: string, format: date-time, nullable: true }

    ProjectInput:
      type: object
      required: [title, status]
      properties:
        title:                    { type: string, minLength: 3, maxLength: 255 }
        slug:                     { type: string, description: Derived from the title when omitted }
        description:              { type: string, nullable: true }
        longDescription:          { type: string, nullable: true }
        projectTypeId:            { type: string, format: uuid, nullable: true }
        locationId:               { type: string, format: uuid, nullable: true }
        sectorId:                 { type: string, format: uuid, nullable: true }
        status:                   { $ref: '#/components/schemas/ProjectStatus' }
        featuredImageUrl:         { type: string, nullable: true }
        brochureUrl:              { type: string, nullable: true }
        timelineVideoUrls:        { type: array, maxItems: 20, items: { type: string } }
        galleryIds:               { type: array, items: { type: string, format: uuid } }
        serviceIds:               { type: array, items: { type: string, format: uuid } }
        tagIds:                   { type: array, items: { type: string, format: uuid } }
        passportEnabled:          { type: boolean }
        passportStartDate:        { type: string, format: date, nullable: true }
        passportCompletionTarget: { type: string, format: date, nullable: true }
        investmentAmount:         { type: number, nullable: true }
        expectedRoi:              { type: number, nullable: true }
        investorHighlights:       { type: object, nullable: true, description: Editing this revokes legal approval }
        metaTitle:                { type: string, nullable: true }
        metaDescription:          { type: string, maxLength: 160, nullable: true }
        publishedAt:              { type: string, format: date-time, nullable: true, description: Null is a draft }

    Milestone:
      type: object
      properties:
        id:             { type: string, format: uuid }
        projectId:      { type: string, format: uuid }
        type:           { $ref: '#/components/schemas/MilestoneType' }
        title:          { type: string, nullable: true }
        description:    { type: string, nullable: true }
        scheduledDate:  { type: string, format: date, nullable: true }
        actualDate:     { type: string, format: date, nullable: true }
        status:         { $ref: '#/components/schemas/MilestoneStatus' }
        sortOrder:      { type: integer }
        photoUrls:      { type: array, items: { type: string } }
        documentUrls:   { type: array, items: { type: string } }
        videoUrl:       { type: string, nullable: true }
        triggeredAt:    { type: string, format: date-time }

    MilestoneInput:
      type: object
      required: [milestoneType]
      properties:
        milestoneType: { $ref: '#/components/schemas/MilestoneType' }
        title:         { type: string, nullable: true }
        description:   { type: string, nullable: true }
        scheduledDate: { type: string, format: date, nullable: true }
        actualDate:    { type: string, format: date, nullable: true, description: Required when status is completed }
        status:        { $ref: '#/components/schemas/MilestoneStatus' }
        sortOrder:     { type: integer, description: Appended to the end of the timeline when omitted }
        photoUrls:     { type: array, items: { type: string } }
        documentUrls:  { type: array, items: { type: string } }
        videoUrl:      { type: string, nullable: true }
        isPublic:      { type: boolean, default: true }

    PassportTimeline:
      type: object
      properties:
        project:
          type: object
          properties:
            id:    { type: string, format: uuid }
            title: { type: string }
            slug:  { type: string }
        passportEnabled: { type: boolean }
        progress:
          type: object
          properties:
            total:           { type: integer }
            completed:       { type: integer }
            percentComplete: { type: integer }
        milestones:
          type: array
          items: { $ref: '#/components/schemas/Milestone' }

    Tour:
      type: object
      properties:
        id:               { type: string, format: uuid }
        projectId:        { type: string, format: uuid }
        name:             { type: string }
        type:             { type: string, enum: [threejs_model, matterport_embed, custom_viewer] }
        description:      { type: string, nullable: true }
        thumbnailUrl:     { type: string, nullable: true }
        tourUrl:          { type: string, nullable: true }
        embedCode:        { type: string, nullable: true }
        fileSizeBytes:    { type: integer, nullable: true }
        featured:         { type: boolean }
        viewCount:        { type: integer }
        processingStatus: { type: string, enum: [pending, processing, ready, failed] }
        uploadedAt:       { type: string, format: date-time }

    TourInput:
      type: object
      required: [projectId, tourName, tourType]
      properties:
        projectId:    { type: string, format: uuid }
        tourName:     { type: string }
        tourType:     { type: string, enum: [threejs_model, matterport_embed, custom_viewer] }
        modelKey:     { type: string, description: Required for threejs_model — the UploadThing file key returned by the upload }
        tourUrl:      { type: string, description: Required for custom_viewer }
        embedCode:    { type: string, description: Required for matterport_embed unless tourUrl is given }
        thumbnailUrl: { type: string }
        description:  { type: string }
        featured:     { type: boolean, default: false }
        published:    { type: boolean, default: true }

    TaxonomyLabel:
      type: object
      properties:
        id:   { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }

    TourUpdate:
      type: object
      additionalProperties: false
      properties:
        tourName:     { type: string }
        modelKey:     { type: string, description: threejs_model only — the UploadThing key of a replacement file }
        tourUrl:      { type: string, nullable: true, description: Not accepted for threejs_model }
        embedCode:    { type: string, nullable: true, description: matterport_embed only }
        thumbnailUrl: { type: string, nullable: true }
        description:  { type: string, nullable: true }
        featured:     { type: boolean }
        published:    { type: boolean }

    NewsCategory:
      type: string
      enum: [press_release, project_update, thought_leadership, industry_insight, company_announcement]
      description: |
        The media centre's five categories, in the order the site shows them.
        `update` and `announcement`, the launch-era names, are accepted
        wherever a category is sent and stored as `project_update` and
        `company_announcement`; migration 0018 renamed the stored rows. The
        column itself is free text, so a category the CMS sends of its own is
        kept as sent and returned as a plain string.

    NewsSummary:
      type: object
      properties:
        id:               { type: string, format: uuid }
        title:            { type: string }
        slug:             { type: string }
        excerpt:          { type: string, nullable: true }
        category:
          type: string
          nullable: true
          description: A `NewsCategory` value, or a CMS category of its own. Never a launch-era name.
        tags:             { type: array, items: { type: string } }
        author:           { type: string, nullable: true }
        featuredImageUrl: { type: string, nullable: true }
        publishedAt:      { type: string, format: date-time, nullable: true }

    News:
      allOf:
        - $ref: '#/components/schemas/NewsSummary'
        - type: object
          properties:
            content: { type: string }

    NewsDetail:
      allOf:
        - $ref: '#/components/schemas/News'
        - type: object
          properties:
            related:
              type: array
              description: Ranked by shared tags, then by category.
              items: { $ref: '#/components/schemas/NewsSummary' }

    NewsInput:
      type: object
      required: [title, content]
      properties:
        title:            { type: string, minLength: 3 }
        slug:             { type: string }
        content:          { type: string }
        excerpt:          { type: string, maxLength: 300, nullable: true }
        category:
          type: string
          maxLength: 100
          nullable: true
          description: |
            A `NewsCategory` value; the console offers only these. `update`,
            `announcement` and other spellings of the five are stored in their
            canonical form; any other value is kept as sent. Blank clears it.
        featuredImageUrl: { type: string, nullable: true }
        tags:             { type: array, items: { type: string } }
        metaTitle:        { type: string, nullable: true }
        metaDescription:  { type: string, maxLength: 160, nullable: true }
        publishedAt:      { type: string, format: date-time, nullable: true }

    LeadershipTier:
      type: string
      enum: [board, executive, management]
      description: The organisational structure the leadership page groups by.

    Leader:
      type: object
      properties:
        id:             { type: string, format: uuid }
        slug:           { type: string }
        fullName:       { type: string }
        roleTitle:      { type: string, nullable: true }
        summary:        { type: string, nullable: true, description: Short profile for cards and the homepage spotlight }
        bio:            { type: string, nullable: true, description: Professional biography; paragraphs separated by a blank line }
        qualifications: { type: array, items: { type: string } }
        expertise:      { type: array, items: { type: string }, description: Areas of expertise }
        quote:          { type: string, nullable: true }
        photoUrl:       { type: string, nullable: true }
        photoAlt:       { type: string, nullable: true }
        socialLinks:
          type: object
          properties:
            linkedin: { type: string, nullable: true }
            x:        { type: string, nullable: true }
            website:  { type: string, nullable: true }
        tier:      { $ref: '#/components/schemas/LeadershipTier' }
        featured:  { type: boolean, description: In the homepage spotlight }
        sortOrder: { type: integer }

    LeaderAdmin:
      allOf:
        - $ref: '#/components/schemas/Leader'
        - type: object
          properties:
            published: { type: boolean }
            cms:
              type: object
              nullable: true
              description: Set when the row is mirrored from the CMS, whose next publish overwrites console edits.
              properties:
                source:   { type: string }
                syncedAt: { type: string, format: date-time, nullable: true }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    LeaderInput:
      description: Unknown fields are rejected with a 422.
      allOf:
        - $ref: '#/components/schemas/LeaderFields'
        - type: object
          required: [fullName, roleTitle]

    LeaderUpdate:
      description: |
        Any subset of the `LeaderFields`, at least one; `null` clears an
        optional field. Unknown fields are rejected with a 422.
      allOf:
        - $ref: '#/components/schemas/LeaderFields'
        - type: object
          minProperties: 1

    LeaderFields:
      type: object
      properties:
        fullName:       { type: string, minLength: 2, maxLength: 255 }
        slug:           { type: string }
        roleTitle:      { type: string, minLength: 2, maxLength: 255 }
        summary:        { type: string, maxLength: 300, nullable: true }
        bio:            { type: string, maxLength: 20000, nullable: true }
        qualifications: { type: array, maxItems: 20, uniqueItems: true, items: { type: string, maxLength: 200 } }
        expertise:      { type: array, maxItems: 20, uniqueItems: true, items: { type: string, maxLength: 200 } }
        quote:          { type: string, maxLength: 300, nullable: true }
        photoUrl:       { type: string, format: uri, pattern: '^https://', nullable: true }
        photoAlt:       { type: string, maxLength: 255, nullable: true }
        socialLinks:
          type: object
          additionalProperties: false
          properties:
            linkedin: { type: string, format: uri, pattern: '^https://' }
            x:        { type: string, format: uri, pattern: '^https://' }
            website:  { type: string, format: uri, pattern: '^https://' }
        tier:      { $ref: '#/components/schemas/LeadershipTier' }
        published: { type: boolean, default: false }
        featured:  { type: boolean, default: false }

    ServiceStep:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 160 }
        body:  { type: string, maxLength: 1000, default: '' }

    ServiceSummary:
      type: object
      properties:
        id:            { type: string, format: uuid }
        slug:          { type: string }
        title:         { type: string }
        summary:       { type: string }
        informational: { type: boolean, description: Information only — no call to action on the page }

    Service:
      allOf:
        - $ref: '#/components/schemas/ServiceSummary'
        - type: object
          properties:
            standfirst:   { type: string }
            body:         { type: array, items: { type: string }, description: Overview paragraphs }
            covers:       { type: array, items: { type: string }, description: Scope of work }
            deliverables: { type: array, items: { type: string } }
            suitedTo:     { type: array, items: { type: string } }
            process:      { type: array, items: { $ref: '#/components/schemas/ServiceStep' } }
            benefits:     { type: array, items: { $ref: '#/components/schemas/ServiceStep' } }
            seo:
              type: object
              properties:
                metaTitle:       { type: string, nullable: true }
                metaDescription: { type: string, nullable: true }

    ServiceProject:
      type: object
      properties:
        id:               { type: string, format: uuid }
        slug:             { type: string }
        title:            { type: string }
        description:      { type: string, nullable: true }
        status:           { $ref: '#/components/schemas/ProjectStatus' }
        location:         { type: string, nullable: true }
        featuredImageUrl: { type: string, nullable: true }
        caseStudy:        { type: boolean }

    ServiceProjectAdmin:
      allOf:
        - $ref: '#/components/schemas/ServiceProject'
        - type: object
          properties:
            isPublished: { type: boolean, description: False projects stay off the public page }

    ServiceDetail:
      allOf:
        - $ref: '#/components/schemas/Service'
        - type: object
          properties:
            caseStudies:     { type: array, items: { $ref: '#/components/schemas/ServiceProject' } }
            relatedProjects: { type: array, items: { $ref: '#/components/schemas/ServiceProject' } }

    ServiceAdmin:
      allOf:
        - $ref: '#/components/schemas/Service'
        - type: object
          properties:
            published:    { type: boolean }
            sortOrder:    { type: integer }
            projectCount: { type: integer, description: On list responses only }
            createdAt:    { type: string, format: date-time }
            updatedAt:    { type: string, format: date-time }

    ServiceAdminDetail:
      allOf:
        - $ref: '#/components/schemas/ServiceAdmin'
        - type: object
          properties:
            projects: { type: array, items: { $ref: '#/components/schemas/ServiceProjectAdmin' } }

    ServiceFields:
      type: object
      description: Unknown fields are refused with a 422.
      properties:
        title:           { type: string, minLength: 2, maxLength: 255 }
        slug:            { type: string, description: 'The page lives at /services/{slug}' }
        summary:         { type: string, maxLength: 300, description: The line on the service's card }
        standfirst:      { type: string, maxLength: 600 }
        body:            { type: array, maxItems: 20, items: { type: string }, description: Overview paragraphs }
        covers:          { type: array, maxItems: 30, items: { type: string }, description: Scope of work }
        deliverables:    { type: array, maxItems: 30, items: { type: string } }
        suitedTo:        { type: array, maxItems: 30, items: { type: string } }
        process:         { type: array, maxItems: 12, items: { $ref: '#/components/schemas/ServiceStep' } }
        benefits:        { type: array, maxItems: 12, items: { $ref: '#/components/schemas/ServiceStep' } }
        informational:   { type: boolean, default: false }
        published:       { type: boolean, default: false }
        metaTitle:       { type: string, maxLength: 255, nullable: true }
        metaDescription: { type: string, maxLength: 160, nullable: true }

    ServiceInput:
      allOf:
        - $ref: '#/components/schemas/ServiceFields'
        - required: [title, summary]

    ServiceUpdate:
      description: Any of the service fields, at least one; the ones present are applied.
      allOf:
        - $ref: '#/components/schemas/ServiceFields'
        - minProperties: 1

    VideoCategory:
      type: string
      enum: [project_documentary, construction_update, drone, leadership_interview, educational, corporate, event_highlights]

    VideoProject:
      type: object
      properties:
        id:               { type: string, format: uuid }
        slug:             { type: string, description: 'The project page is /projects/{slug}' }
        title:            { type: string }
        featuredImageUrl: { type: string, nullable: true }

    Video:
      type: object
      properties:
        id:              { type: string, format: uuid }
        slug:            { type: string, description: 'The page lives at /videos/{slug}' }
        title:           { type: string }
        description:     { type: string, description: Paragraphs separated by a blank line }
        category:        { $ref: '#/components/schemas/VideoCategory' }
        youtubeId:       { type: string, pattern: '^[A-Za-z0-9_-]{11}$', description: Embed from youtube-nocookie.com with this ID }
        watchUrl:        { type: string, description: The canonical youtube.com watch link }
        thumbnailUrl:
          type: string
          nullable: true
          description: The editor's thumbnail, else the linked project's photograph, else null. Never YouTube's own.
        durationSeconds: { type: integer, nullable: true }
        recordedOn:      { type: string, format: date, nullable: true }
        featured:        { type: boolean }
        project:
          nullable: true
          description: The project the film documents, while that project is published
          allOf:
            - $ref: '#/components/schemas/VideoProject'

    VideoDetail:
      allOf:
        - $ref: '#/components/schemas/Video'
        - type: object
          properties:
            related: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/Video' } }

    VideoAdmin:
      allOf:
        - $ref: '#/components/schemas/Video'
        - type: object
          properties:
            thumbnailUrl: { type: string, nullable: true, description: The editor's own thumbnail only }
            projectId:    { type: string, format: uuid, nullable: true }
            project:
              nullable: true
              description: The linked project whatever its state
              allOf:
                - $ref: '#/components/schemas/VideoProject'
                - type: object
                  properties:
                    isPublished: { type: boolean, description: False projects are not linked on the public site }
            published:    { type: boolean }
            sortOrder:    { type: integer }
            createdAt:    { type: string, format: date-time }
            updatedAt:    { type: string, format: date-time }

    VideoFields:
      type: object
      description: Unknown fields are refused with a 422.
      properties:
        youtubeUrl:
          type: string
          maxLength: 512
          description: A watch, youtu.be, embed, Shorts or live link to one YouTube video. Only the video ID is kept.
        title:           { type: string, minLength: 2, maxLength: 255 }
        slug:            { type: string, description: 'The page lives at /videos/{slug}' }
        description:     { type: string, maxLength: 5000, default: '' }
        category:        { $ref: '#/components/schemas/VideoCategory' }
        projectId:       { type: string, format: uuid, nullable: true, default: null }
        thumbnailUrl:    { type: string, maxLength: 512, nullable: true, default: null, description: https only }
        durationSeconds: { type: integer, minimum: 1, maximum: 86400, nullable: true, default: null }
        recordedOn:      { type: string, format: date, nullable: true, default: null }
        featured:        { type: boolean, default: false, description: The first featured video leads /videos }
        published:       { type: boolean, default: false }

    VideoInput:
      allOf:
        - $ref: '#/components/schemas/VideoFields'
        - required: [youtubeUrl, title, category]

    VideoUpdate:
      description: Any of the video fields, at least one; the ones present are applied.
      allOf:
        - $ref: '#/components/schemas/VideoFields'
        - minProperties: 1

    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              id:          { type: string }
              type:        { type: string, enum: [project, news, faq] }
              title:       { type: string }
              slug:        { type: string }
              excerpt:     { type: string, nullable: true }
              url:         { type: string }
              publishedAt: { type: string, format: date-time, nullable: true }
              score:       { type: number }
        total:    { type: integer }
        page:     { type: integer }
        pageSize: { type: integer }
        engine:
          type: string
          enum: [meilisearch, postgres]
          description: Which backend answered. `postgres` means the fallback is in use.

    InquiryInput:
      type: object
      required: [name, email, message, consent]
      properties:
        name:      { type: string, minLength: 2 }
        email:     { type: string, format: email }
        phone:     { type: string }
        subject:   { type: string }
        message:   { type: string, minLength: 10, maxLength: 5000 }
        projectId: { type: string, format: uuid }
        consent:   { type: boolean, enum: [true], description: NDPA consent, required }
        website:   { $ref: '#/components/schemas/Honeypot' }

    InvestmentInput:
      type: object
      required: [name, email, message, consent]
      properties:
        name:            { type: string, minLength: 2 }
        email:           { type: string, format: email }
        phone:           { type: string }
        companyName:     { type: string }
        investmentRange: { type: string, enum: [under_50m, 50m_250m, 250m_1b, above_1b, undisclosed] }
        projectId:       { type: string, format: uuid }
        message:         { type: string, minLength: 10, maxLength: 5000 }
        consent:         { type: boolean, enum: [true] }
        website:         { $ref: '#/components/schemas/Honeypot' }

    HomepageStatOverride:
      type: object
      nullable: true
      description: Replaces the computed figure. 0 hides the figure; null uses the count.
      required: [value]
      properties:
        value: { type: integer, minimum: 0, maximum: 1000000 }
        plus:  { type: boolean, default: false, description: Shown as "30+" }

    HomepageSettings:
      type: object
      required: [heroHeadline, heroSubheading, video, stats, sections]
      properties:
        heroHeadline:
          type: string
          maxLength: 160
          nullable: true
          description: '`*phrase*` marks the accent italic. The tagline is fixed and not settable.'
        heroSubheading: { type: string, maxLength: 320, nullable: true }
        video:
          type: object
          nullable: true
          required: [url, title]
          properties:
            url:   { type: string, description: A YouTube link to one video, stored as https://www.youtube.com/watch?v=… }
            title: { type: string, minLength: 3, maxLength: 120, description: The player's accessible name }
        stats:
          type: object
          required: [completed, ongoing, units, locations]
          properties:
            completed: { $ref: '#/components/schemas/HomepageStatOverride' }
            ongoing:   { $ref: '#/components/schemas/HomepageStatOverride' }
            units:     { $ref: '#/components/schemas/HomepageStatOverride' }
            locations: { $ref: '#/components/schemas/HomepageStatOverride' }
        sections:
          type: object
          required: [news, leadership, video]
          properties:
            news:       { type: boolean }
            leadership: { type: boolean }
            video:      { type: boolean }

    HomepageSettingsView:
      type: object
      properties:
        settings: { $ref: '#/components/schemas/HomepageSettings' }
        computed:
          type: object
          properties:
            completed: { type: integer }
            ongoing:   { type: integer }
            locations: { type: integer }
        updatedAt: { type: string, format: date-time, nullable: true }
        updatedBy: { type: string, nullable: true, description: Full name of whoever saved last }

    User:
      type: object
      properties:
        id:                { type: string, format: uuid }
        email:             { type: string, format: email }
        fullName:          { type: string, nullable: true }
        role:              { $ref: '#/components/schemas/Role' }
        isActive:          { type: boolean }
        emailVerified:     { type: boolean }
        twoFactorEnabled:  { type: boolean }
        createdAt:         { type: string, format: date-time }
        lastLogin:         { type: string, format: date-time, nullable: true }

security:
  - bearerAuth: []
